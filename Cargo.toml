[package]
name = "msi-gpu-mux"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Anees Iqbal <hello@aneesiqbal.ai>"]
license = "MIT"
readme = "README.md"
description = "Inspect and switch GPU MUX modes on characterized MSI laptops"
keywords = ["msi", "gpu", "mux", "windows", "linux"]
categories = ["command-line-utilities", "hardware-support"]
default-run = "msi-mux-switch"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }
winreg = "0.56.0"
wmi = { version = "0.18.4", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.30.1", features = ["ioctl"] }

[build-dependencies]
embed-resource = "3.0.11"

[[bin]]
name = "msi-mux-switch"
path = "src/bin/msi-mux-switch.rs"
# Keep the binary out of `cargo test`: on Windows its test harness would also
# embed the Administrator manifest and need an elevated shell to run.
test = false

# Only the binary uses clap and serde_json, and `cargo test` does not build it,
# so Cargo would report both as unused.
[lints.cargo]
unused_dependencies = "allow"
